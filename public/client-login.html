<!doctype html><html><head><link rel="preload" as="image" href="/logo.webp" type="image/webp"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Login | A&C Solutions</title><link rel="stylesheet" href="/auth.css?v=8"></head><body><main class="auth-shell"><div class="auth-card"><img src="/logo.webp" class="auth-logo" width="1200" height="632" decoding="async"><p class="eyebrow">CLIENT PORTAL</p><h1>Client Portal Sign In</h1><p>Access your company details, services and assigned team.</p><form id="loginForm"><label>Username or Email<input id="identifier" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">Sign in to Client Portal →</button><p id="note"></p></form><div class="portal-switch"><a href="/client-login">Client</a><a href="/employee-login">Employee</a><a href="/admin-login">Admin</a><a href="/">Company Website</a></div></div></main><script>const f=document.querySelector('#loginForm'),n=document.querySelector('#note');f.addEventListener('submit',async e=>{e.preventDefault();n.textContent='Signing in…';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({username:identifier.value,password:password.value,role:'client'})});const d=await r.json();if(!r.ok)throw new Error(d.message||'Login failed');location.href='/client'}catch(x){n.textContent=x.message}});</script></body></html>
