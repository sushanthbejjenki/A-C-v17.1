<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Portal | A&C Solutions</title><link rel="stylesheet" href="/workspace.css?v=8"></head><body><header><img src="/logo.webp" alt="A&C Solutions Pvt. Ltd." width="1200" height="632" decoding="async"><div class="head-actions"><a class="btn btn-light" href="/">Website</a><button id="logout" class="btn btn-red">Sign out</button></div></header><main class="wrap"><div class="hero"><div><div class="eyebrow">CLIENT PORTAL</div><h1 id="company">Client Dashboard</h1><p class="muted">Your company information, services and assigned A&C team.</p></div></div><div id="note"></div><div class="layout"><section><div class="card section"><h2>Company Details</h2><div id="details"></div></div><div class="card section"><h2>Assigned A&C Team</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Name</th><th>Employee ID</th><th>Department</th><th>Designation</th></tr></thead><tbody id="team"></tbody></table></div></div></section><aside class="card"><h2>Service</h2><div id="service"></div><p class="muted">For service changes or support, please contact A&C Solutions through your normal company communication channel.</p></aside></div></main><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));(async()=>{try{const r=await fetch('/api/workspace/client/dashboard',{credentials:'include'}),d=await r.json();if(!r.ok)throw Error(d.message);if(!d.client){$('#company').textContent='Client account';$('#details').textContent='No company profile is linked yet.';return}const c=d.client;$('#company').textContent=c.companyName;$('#details').innerHTML=`<p><b>Contact:</b> ${esc(c.contactPerson)}</p><p><b>Email:</b> ${esc(c.email||'—')}</p><p><b>Phone:</b> ${esc(c.phone||'—')}</p><p><b>Address:</b> ${esc(c.address||'—')}</p><p><b>Status:</b> ${esc(c.status)}</p>`;$('#service').innerHTML=`<h3>${esc(c.service||'Assigned service')}</h3><p>${esc(c.notes||'A&C Solutions service support')}</p>`;$('#team').innerHTML=(c.assignedEmployees||[]).map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.employeeId||'—')}</td><td>${esc(e.department||'—')}</td><td>${esc(e.designation||'—')}</td></tr>`).join('')||'<tr><td colspan="4">No team assigned yet.</td></tr>'}catch(e){$('#note').innerHTML='<div class="notice danger">'+esc(e.message)+'</div>'}})();$('#logout').onclick=async()=>{await fetch('/api/logout',{method:'POST',credentials:'include'});location.href='/client-login'};</script></body></html>
